<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  <title>Home Messaging</title>
  <style>
    :root {
      --bg: #09090b;
      --bg-soft: #18181b;
      --card: rgba(24, 24, 27, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #ffffff;
      --success: #16a34a;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 15% -10%, rgba(255,255,255,0.03) 0%, transparent 60%),
        radial-gradient(800px 400px at 100% 0%, rgba(255,255,255,0.02) 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; width: 96%; }
    #authCard { max-width: 440px; margin: 40px auto; }
    h2 { margin: 0 0 16px; letter-spacing: .2px; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #334774;
      font-size: 15px;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text);
    }
    
    input[type="color"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: transparent;
      border: 1px solid var(--card-border);
      width: 100%;
      height: 44px;
      border-radius: 10px;
      padding: 4px;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    input[type="color"]::-moz-color-swatch { border: none; border-radius: 6px; }

    input {
      background: #0e1730;
      color: var(--text);
      min-width: 180px;
    }
    input::placeholder { color: var(--muted); }
    button {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-weight: 500;
      transition: all .15s ease;
      backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    button:active { transform: translateY(0); background: rgba(255,255,255,0.04); }
    #sendBtn, #loginBtn, #registerBtn {
       background: var(--text);
       color: var(--bg);
       border: none;
       font-weight: 600;
    }
    #sendBtn:hover, #loginBtn:hover, #registerBtn:hover { background: #d4d4d4; }
    #messages {
      height: 75vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      margin-top: 8px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      position: relative;
      max-width: 85%;
      line-height: 1.5;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg-mine {
      margin-left: auto;
      background: var(--user-theme, #3f3f46);
      color: var(--bg); /* Best contrast for bright user themes */
      border-bottom-right-radius: 4px;
    }
    .msg-theirs {
      margin-right: auto;
      background: var(--theirs-bg, var(--bg-soft));
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 4px;
    }
    audio { width: 100%; margin-top: 6px; }
    small { color: var(--muted); display: block; margin-top: 6px; }
    #authStatus, #status { min-height: 18px; }
    .chat-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
    .sidebar { border-right: 1px solid var(--card-border); padding-right: 20px; }
    .panel { background:var(--bg-soft); border:1px solid var(--card-border); border-radius:12px; padding:16px; }
    @media (max-width: 768px) { 
      .chat-grid { grid-template-columns: 1fr; }
      .wrap { padding: 16px 12px 32px; }
      #messages { height: 60vh; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0; font-weight:600; letter-spacing:-0.5px;">Home Messaging</h2>
    <div id="navButtons" style="display:none; gap:8px;">
      <button id="navChatBtn" style="display:none;">💬 Chat</button>
      <button id="navSettingsBtn">⚙️ Settings</button>
    </div>
  </div>

  <div class="card" id="authCard">
    <h3>Login / Register</h3>
    <div class="row"><input id="username" placeholder="Username" /><input id="password" type="password" placeholder="Password" /></div>
    <div class="row" style="margin-top:8px"><input id="invite" placeholder="Invite code (required except first account)" style="flex:1" /></div>
    <div class="row" style="margin-top:8px"><input id="ownerKey" placeholder="Owner setup key (optional, for recovery)" style="flex:1" /></div>
    <div class="row" style="margin-top:8px"><button id="loginBtn">Login</button><button id="registerBtn">Register</button></div>
    <label><input id="rememberMe" type="checkbox" checked /> Remember my login details on this device</label>
      <small id="authStatus"></small>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <div class="chat-grid">
      <div class="sidebar">
        <strong>Conversations</strong>
        <div id="groupsList" style="margin-top:8px"></div>
        <button id="createGroupBtn" style="display:none; width:100%; margin-top:12px;">+ Create Group</button>
        
        <strong style="display:block; margin-top:24px;">Contacts</strong>
        <div id="contactsList" style="margin-top:12px"></div>
      </div>

      <div style="position:relative; display:flex; flex-direction:column;">
        <div class="row" style="justify-content:space-between; align-items:center">
          <strong id="groupTitle">Conversation</strong>
          <button id="inviteBtn" style="display:none">Create Invite</button>
        </div>
        <div id="inviteOut"></div>
        <div id="messages" style="flex:1;"></div>
        <small id="replyInfo"></small>
        
        <div id="gifPicker" class="panel" style="display:none; position:absolute; bottom:64px; right:0; width:100%; max-width:280px; max-height:300px; overflow-y:auto; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
          <input id="gifSearch" placeholder="Search Tenor..." style="width:100%; margin-bottom:8px; border-radius:12px; padding:8px;" />
          <div id="gifResults" style="display:grid; grid-template-columns:1fr 1fr; gap:4px;"></div>
        </div>

        <div style="display:flex; align-items:center; background:var(--bg-soft); border-radius:24px; padding:4px 8px; margin-top:10px; border:1px solid var(--card-border); position:relative; box-shadow:0 2px 12px rgba(0,0,0,0.05);">
          <button id="sttBtn" title="Voice to Text" style="background:none; border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;">🎤</button>
          <button id="recBtn" title="Record Voice Note" style="background:none; border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;">⏺️</button>
          
          <input id="textInput" placeholder="Type message" style="flex:1; background:transparent; border:none; outline:none; padding:8px 12px; box-shadow:none; min-width:0;"/>
          
          <button id="gifBtn" type="button" style="background:none; border:none; font-weight:bold; font-size:11px; padding:0 8px; color:var(--text); cursor:pointer;">GIF</button>
          <button id="emojiBtn" type="button" style="background:none; border:none; padding:0 8px; font-size:18px; cursor:pointer;">😀</button>
          <button id="sendBtn" style="border-radius:20px; padding:6px 16px; margin-left:4px;">Send</button>
          
          <emoji-picker id="emojiPicker" style="display:none; position:absolute; bottom:100%; right:0; z-index:100; --background:var(--bg-soft); --border-color:var(--card-border); margin-bottom:8px;"></emoji-picker>
        </div>
        <small id="status" style="margin-top:8px; text-align:center;"></small>
      </div>

      </div>
    </div>
  </div>

  <div class="card" id="settingsCard" style="display:none; max-width:500px; margin:0 auto;">
    <div class="panel">
      <h3 style="margin-top:0;">⚙️ Settings</h3>
      <div style="margin-top:8px"><small id="welcome"></small></div>

      <div style="margin-bottom:24px">
          <small style="color:var(--muted); display:block; margin: 0 0 10px">Theme Presets</small>
          <div style="display:flex; gap:10px; margin-bottom:16px; overflow-x:auto; padding-bottom:12px;">
            <button class="preset-btn" data-theme='{"bg":"#09090b", "text":"#fafafa", "mine":"#2563eb", "theirs":"#27272a"}' style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 16px; border-radius:24px; background:#09090b; color:#fafafa; border:1px solid #27272a; font-size:13px; font-weight:600;"><span style="width:12px; height:12px; border-radius:50%; background:#2563eb;"></span> Midnight</button>
            <button class="preset-btn" data-theme='{"bg":"#fff1f2", "text":"#4c0519", "mine":"#fb7185", "theirs":"#ffe4e6"}' style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 16px; border-radius:24px; background:#fff1f2; color:#4c0519; border:1px solid #fecdd3; font-size:13px; font-weight:600;"><span style="width:12px; height:12px; border-radius:50%; background:#fb7185;"></span> Rose Gold</button>
            <button class="preset-btn" data-theme='{"bg":"#2e3440", "text":"#eceff4", "mine":"#88c0d0", "theirs":"#3b4252"}' style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 16px; border-radius:24px; background:#2e3440; color:#eceff4; border:1px solid #434c5e; font-size:13px; font-weight:600;"><span style="width:12px; height:12px; border-radius:50%; background:#88c0d0;"></span> Nordic</button>
            <button class="preset-btn" data-theme='{"bg":"#022c22", "text":"#ecfdf5", "mine":"#059669", "theirs":"#064e3b"}' style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 16px; border-radius:24px; background:#022c22; color:#ecfdf5; border:1px solid #064e3b; font-size:13px; font-weight:600;"><span style="width:12px; height:12px; border-radius:50%; background:#059669;"></span> Forest</button>
            <button class="preset-btn" data-theme='{"bg":"#f8f9fa", "text":"#212529", "mine":"#0d6efd", "theirs":"#e9ecef"}' style="display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 16px; border-radius:24px; background:#f8f9fa; color:#212529; border:1px solid #dee2e6; font-size:13px; font-weight:600;"><span style="width:12px; height:12px; border-radius:50%; background:#0d6efd;"></span> Clean Light</button>
          </div>

          <small style="color:var(--muted); display:block; margin:20px 0 10px; border-top:1px solid var(--card-border); padding-top:20px;">Custom Colors</small>
          <div class="row" style="gap:8px; margin-bottom:12px;">
            <div style="flex:1;">
              <small style="color:var(--muted); display:block; margin-bottom:4px">Background</small>
              <input type="color" id="bgInput" value="#09090b" style="width:100%" />
            </div>
            <div style="flex:1;">
              <small style="color:var(--muted); display:block; margin-bottom:4px">Text Color</small>
              <input type="color" id="textInputColor" value="#f4f4f5" style="width:100%" />
            </div>
          </div>
          
          <div class="row" style="gap:8px; margin-bottom:12px;">
            <div style="flex:1;">
              <small style="color:var(--muted); display:block; margin-bottom:4px">My Msgs</small>
              <input type="color" id="themeInput" value="#ffffff" style="width:100%" />
            </div>
            <div style="flex:1;">
               <small style="color:var(--muted); display:block; margin-bottom:4px">Their Msgs</small>
               <input type="color" id="theirsInput" value="#18181b" style="width:100%" />
            </div>
          </div>
          
          <small style="color:var(--muted); display:block; margin:12px 0 4px">Wallpaper URL</small>
          <input type="text" id="wallpaperInput" placeholder="https://..." style="width:100%" />
          
          <small style="color:var(--muted); display:block; margin:12px 0 4px">Font Family</small>
          <select id="fontFamilyInput" style="width:100%; padding:10px; background:rgba(0,0,0,0.2); color:var(--text); border:1px solid var(--card-border); border-radius:8px;">
            <option value="Inter">Inter (Sleek)</option>
            <option value="Outfit">Outfit (Modern)</option>
            <option value="Roboto">Roboto (Clean)</option>
            <option value="Courier New">Courier New (Monospace)</option>
            <option value="Comic Sans MS">Comic Sans (Playful)</option>
          </select>
          
          <small style="color:var(--muted); display:block; margin:12px 0 4px">Font Size (<span id="fontSizeDisplay">15px</span>)</small>
          <input type="range" id="fontSizeInput" min="12" max="24" value="15" style="width:100%" />

          <button id="saveThemeBtn" class="btn-primary" style="width:100%; margin-top:16px;">Save Settings</button>
        </div>

      <button id="logoutBtn" style="width:100%; margin-top:12px; background:var(--danger);">Logout</button>
      <div id="adminPanel" style="display:none; margin-top:24px; border-top:1px solid var(--card-border); padding-top:16px;">
        <strong>Family members</strong>
        <div id="membersList" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

<div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; backdrop-filter:blur(4px);">
  <div class="card" style="min-width:320px; box-shadow:0 24px 48px rgba(0,0,0,0.6); background:#18181b; border:1px solid rgba(255,255,255,0.1);">
    <h3 id="modalTitle" style="margin-top:0; font-weight:600;">Title</h3>
    <p id="modalMessage" style="color:var(--muted); line-height:1.5;"></p>
    <input id="modalInput" style="width:100%; margin-bottom:16px; display:none;" />
    <div class="row" style="justify-content:flex-end; margin-top:16px; gap:12px;">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="btn-primary" style="background:var(--text); color:var(--bg); border:none; font-weight:600;">OK</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
