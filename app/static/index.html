<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <title>Home Messaging</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fb; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 12px; }
    .row { display: flex; gap: 8px; }
    input, button { padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    #messages { height: 50vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #eef2ff; padding: 8px 10px; border-radius: 10px; }
    small { color: #64748b; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>🏠 Home Messaging</h2>

  <div class="card" id="authCard">
    <h3>Login / Register</h3>
    <div class="row"><input id="username" placeholder="Username" /><input id="password" type="password" placeholder="Password" /></div>
    <div class="row" style="margin-top:8px"><input id="invite" placeholder="Invite code (required except first account)" style="flex:1" /></div>
    <div class="row" style="margin-top:8px"><button id="loginBtn">Login</button><button id="registerBtn">Register</button></div>
      <small id="authStatus"></small>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <div class="row" style="justify-content:space-between; align-items:center">
      <strong id="welcome"></strong>
      <button id="inviteBtn" style="display:none">Create Invite</button>
    </div>
    <div id="inviteOut"></div>
    <div id="messages"></div>
    <div class="row" style="margin-top:10px"><input id="textInput" placeholder="Type message" style="flex:1"/><button id="sendBtn">Send</button></div>
    <div class="row" style="margin-top:8px"><button id="recBtn">🎙️ Record Voice Note</button><button id="sttBtn">🗣️ Voice to Text</button></div>
    <small id="status"></small>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
